name: CI - Test Unitarios y Cobertura

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ] 

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Checkeo sin secretos en el codigo subido
      run: |
        # Un check rápido: Si el .env está en el repo, el pipeline falla
        if [ -f .env ]; then echo "ERROR: .env file found in repository!" && exit 1; fi

    - name: Ejecutar Unit Tests con Coverage
      run: |
        # Activamos que falle si falla el primer comando de la tubería
        set -e
        set -o pipefail
        
        export PYTHONPATH=$PYTHONPATH:.
        
        # Ahora, si pytest devuelve error por coverage < 80, el pipeline se detendrá aquí
        pytest --cov=src tests/unit --cov-report=term-missing --cov-fail-under=80 | tee coverage_report.txt

    - name: Generar Reporte en el Resumen
      if: always() # Queremos ver el reporte tanto si falla (rojo) como si pasa (verde)
      run: |
        echo "### 📊 Reporte de Cobertura - JuezIA" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
        # Verificamos si el archivo existe antes de intentar leerlo
        if [ -f coverage_report.txt ]; then
          cat coverage_report.txt >> $GITHUB_STEP_SUMMARY
        else
          echo "No se generó reporte de cobertura." >> $GITHUB_STEP_SUMMARY
        fi
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY