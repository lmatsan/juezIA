name: CI - Test Unitarios y Cobertura

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Checkeo sin secretos en el codigo subido
        run: |
          # Un check rápido: Si el .env está en el repo, el pipeline falla
          if [ -f .env ]; then echo "ERROR: .env file found in repository!" && exit 1; fi

      - name: Run tests and save exit code
        id: tests
        run: |
          mkdir -p test-results
          # 1. Añadimos la raíz al PYTHONPATH para que encuentre 'src'
          # 2. Llamamos explícitamente a 'pytest'
          # 3. Corregimos --cov=src para que mida tu código real
          export PYTHONPATH=$PYTHONPATH:.
          set -o pipefail
          pytest tests/unit --cov=src --cov-report=term-missing --cov-fail-under=80 --junitxml=test-results/results.xml | tee test-results/results.log
          echo $? > pytest_exit_code.txt

      - name: Comment test results and coverage on PR
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const path = 'test-results/results.log';

            if (fs.existsSync(path)) {
              const results = fs.readFileSync(path, 'utf8');
              // GitHub tiene un límite de caracteres en comentarios, cortamos si es muy largo
              const truncated = results.length > 65000 ? results.slice(0, 65000) + '\n...TRUNCATED...' : results;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### 🧪 Test Results with Coverage\n\n\`\`\`text\n${truncated}\n\`\`\``
              });
            } else {
              console.log('No se encontró el archivo de log');
            }

      - name: Validacion final de tests y cobertura
        if: always()
        run: |
          # Recuperamos el código de salida de pytest
          # Si el archivo no existe o el código no es 0, fallamos
          EXIT_CODE=$(cat pytest_exit_code.txt 2>/dev/null || echo 1)

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ Error: Los tests fallaron o la cobertura es inferior al 80%."
            exit $EXIT_CODE
          fi
          echo "✅ Todos los tests pasaron con la cobertura requerida."
