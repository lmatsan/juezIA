name: CI - Test Unitarios y Cobertura

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ] 

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Checkeo sin secretos en el codigo subido
      run: |
        # Un check rápido: Si el .env está en el repo, el pipeline falla
        if [ -f .env ]; then echo "ERROR: .env file found in repository!" && exit 1; fi

    - name: Ejecutar Unit Tests con Coverage
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        set -o pipefail
        # Generamos XML para el bot y TXT para el resumen
        pytest --cov=src tests/unit --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=80 | tee coverage_report.txt
        echo $? > pytest_exit_code.txt

    - name: Publicar Reporte en el Pull Request
      uses: MishaKav/pytest-coverage-comment@main
      # GitHub Action externa (creada por un desarrollador llamado Misha Kavalevich) que 
      # actúa como un "reportero" automático para el repositorio
      if: always() && github.event_name == 'pull_request'
      with:
        pytest-xml-coverage-path: ./coverage.xml
        title: "📊 Reporte de Cobertura - JuezIA"
        badge-title: "Cobertura"
        hide-badge: false
        hide-report: false
        create-new-comment: false # Actualiza el mismo comentario en lugar de inundar el PR

    - name: Generar Reporte en el Resumen (Action Summary)
      if: always()
      run: |
        echo "### 📊 Reporte de Cobertura - JuezIA" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
        [ -f coverage_report.txt ] && cat coverage_report.txt >> $GITHUB_STEP_SUMMARY || echo "No se generó reporte." >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Validar Resultado de Tests
      if: always()
      run: |
        EXIT_CODE=$(cat pytest_exit_code.txt)
        if [ "$EXIT_CODE" -ne 0 ]; then
          echo "❌ Los tests fallaron o cobertura insuficiente."
          exit $EXIT_CODE
        fi