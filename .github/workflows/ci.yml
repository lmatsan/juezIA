name: CI - Test Unitarios y Cobertura

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ] 

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Checkeo sin secretos en el codigo subido
      run: |
        # Un check rápido: Si el .env está en el repo, el pipeline falla
        if [ -f .env ]; then echo "ERROR: .env file found in repository!" && exit 1; fi

    - name: Ejecutar Unit Tests con Coverage
      # Importante: no usamos set -e aquí para poder capturar el error
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        
        # Ejecutamos pytest, guardamos el log y capturamos SU código de salida
        # Usamos pipefail para que el error de pytest no se pierda por el 'tee'
        set -o pipefail
        pytest --cov=src tests/unit --cov-report=term-missing --cov-fail-under=80 | tee coverage_report.txt
        
        # Guardamos el resultado de pytest en un archivo para el siguiente paso
        echo $? > pytest_exit_code.txt

    - name: Generar Reporte en el Resumen
      if: always() # Se ejecuta SIEMPRE (aunque lo anterior falle)
      run: |
        echo "### 📊 Reporte de Cobertura - JuezIA" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
        if [ -f coverage_report.txt ]; then
          cat coverage_report.txt >> $GITHUB_STEP_SUMMARY
        else
          echo "No se generó reporte." >> $GITHUB_STEP_SUMMARY
        fi
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Validar Resultado de Tests
      if: always()
      run: |
        # Leemos el código que guardamos antes
        EXIT_CODE=$(cat pytest_exit_code.txt)
        if [ "$EXIT_CODE" -ne 0 ]; then
          echo "❌ Los tests fallaron o la cobertura es insuficiente (Código: $EXIT_CODE)"
          exit $EXIT_CODE
        fi