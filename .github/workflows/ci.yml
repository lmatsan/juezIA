name: CI - Test Unitarios y Cobertura

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ] 

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Checkeo sin secretos en el codigo subido
      run: |
        # Un check rápido: Si el .env está en el repo, el pipeline falla
        if [ -f .env ]; then echo "ERROR: .env file found in repository!" && exit 1; fi

    - name: Run tests and save exit code
      id: tests
      run: |
          mkdir -p test-results
          PYTHONPATH=src pytest unit_tests/ --capture=tee-sys --cov=model --cov-report=term --cov-report=html --junitxml=test-results/results.xml > test-results/results.log

    - name: Comment test results and coverage on PR
      uses: actions/github-script@v7
      if: always()
      with:
        script: |
            const fs = require('fs');
            const results = fs.readFileSync('test-results/results.log', 'utf8');
            const truncated = results.length > 65000 ? results.slice(0, 65000) + '\n...TRUNCATED...' : results;
            github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: ### 🧪 Test Results with Coverage\n\n\``\n${truncated}\n````}); 
