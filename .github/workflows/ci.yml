name: CI JuezIA - Unit Tests & Coverage

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Unit Tests con Coverage
      run: |
        # --cov=src: Mide la cobertura de la lógica de negocio
        # tests/unit/: Solo ejecuta los tests de esta carpeta
        # --cov-fail-under=80: El pipeline falla si no llegas al 80% de cobertura
        pytest --cov=src tests/unit/ --cov-report=term-missing --cov-fail-under=80