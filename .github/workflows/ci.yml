name: CI - Test Unitarios y Cobertura

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ] 

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Checkeo sin secretos en el codigo subido
      run: |
        # Un check rápido: Si el .env está en el repo, el pipeline falla
        if [ -f .env ]; then echo "ERROR: .env file found in repository!" && exit 1; fi

    - name: Ejecutar Unit Tests con Coverage
      id: pytest_step
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        
        # 1. Ejecutamos pytest y guardamos el log, PERO permitimos que continúe aunque falle
        # Usamos 'set +e' para que no mate el job aquí mismo
        set +e
        pytest --cov=src tests/unit --cov-report=term-missing --cov-fail-under=80 | tee coverage_report.txt
        PYTEST_EXIT_CODE=$?
        set -e
        
        # 2. Guardamos el código de salida para usarlo al final
        echo "EXIT_CODE=$PYTEST_EXIT_CODE" >> $GITHUB_ENV

    - name: Generar Reporte en el Resumen
      if: always() 
      run: |
        echo "### 📊 Reporte de Cobertura - JuezIA" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
        if [ -f coverage_report.txt ]; then
          cat coverage_report.txt >> $GITHUB_STEP_SUMMARY
        else
          echo "No se pudo generar el reporte de cobertura." >> $GITHUB_STEP_SUMMARY
        fi
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Validar Resultado Final
      run: |
        # 3. Aquí es donde realmente hacemos que el check se ponga en ROJO si pytest falló
        if [ "${{ env.EXIT_CODE }}" -ne 0 ]; then
          echo "La cobertura es insuficiente o los tests fallaron."
          exit ${{ env.EXIT_CODE }}
        fi