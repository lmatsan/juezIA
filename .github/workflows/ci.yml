name: CI - Test Unitarios y Cobertura

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ] 

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.9'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Checkeo sin secretos en el codigo subido
      run: |
        # Un check rápido: Si el .env está en el repo, el pipeline falla
        if [ -f .env ]; then echo "ERROR: .env file found in repository!" && exit 1; fi

    - name: Ejecutar Unit Tests con Coverage
      run: |
        # Añadimos PYTHONPATH=. para que reconozca la carpeta src desde la raíz
        export PYTHONPATH=$PYTHONPATH:.
        pytest --cov=src tests/unit --cov-report=term-missing --cov-fail-under=80

        